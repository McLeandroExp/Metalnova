name: metalnova

services:
  # --- Almacén analítico -------------------------------------------------
  db:
    image: postgres:16.4-alpine
    container_name: metalnova_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?define POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:?define POSTGRES_DB en .env}
      TZ: ${TZ:-UTC}
      PGTZ: ${TZ:-UTC}
    ports:
      # Publicado SOLO en loopback: no queda accesible desde la red.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - metalnova_pgdata:/var/lib/postgresql/data
      # Los scripts de initdb solo se ejecutan con un directorio de datos vacío.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      # Scripts versionados para aplicar de forma explícita e idempotente.
      - ./sql:/sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - metalnova_net

  # --- Cliente de base de datos ------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:9.18
    container_name: metalnova_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?define PGADMIN_DEFAULT_EMAIL en .env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?define PGADMIN_DEFAULT_PASSWORD en .env}
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_DISABLE_POSTFIX: "True"
      TZ: ${TZ:-UTC}
    ports:
      # Interfaz web publicada SOLO en loopback.
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    volumes:
      - metalnova_pgadmin:/var/lib/pgadmin
      # Servidor pre-registrado; se importa al inicializar el volumen de pgAdmin.
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - metalnova_net

  # --- Generación, carga y simulación (se invoca on-demand) --------------
  ingestor:
    build:
      context: ./python
    image: metalnova/ingestor:local
    container_name: metalnova_ingestor
    profiles: ["tools"]
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ:-UTC}
      PYTHONUNBUFFERED: "1"
      # Ingesta continua (004): valores por defecto, sobreescribibles en .env
      SIM_INTERVAL_SECONDS: ${SIM_INTERVAL_SECONDS:-60}
      SIM_SEED: ${SIM_SEED:-42}
      SIM_INTENSITY: ${SIM_INTENSITY:-1.0}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./sql:/app/sql:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - metalnova_net

networks:
  metalnova_net:
    driver: bridge

volumes:
  metalnova_pgdata:
    name: metalnova_pgdata
  metalnova_pgadmin:
    name: metalnova_pgadmin
